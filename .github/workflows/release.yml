# Releases one server. Push a tag `<server>-v<version>`, for example `weather-v0.1.0`.
# Authenticates with npm trusted publishing (OIDC). The secret NPM_TOKEN is only needed
# for the first release of a package, because npm can only trust a publisher for a package
# that exists. See .claude/skills/publish-mcp/SKILL.md.
name: release

on:
  push:
    tags: ["*-v[0-9]*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        # Keep in sync with PLATFORMS in crates/xtask/src/package.rs.
        include:
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-pc-windows-msvc, os: windows-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          server="${GITHUB_REF_NAME%-v*}"
          rustup target add "$TARGET"
          cargo build --release --locked -p "${server}-mcp" --target "$TARGET"
          mkdir upload
          binary="target/$TARGET/release/${server}-mcp"
          if [[ "$TARGET" == *windows* ]]; then binary="$binary.exe"; fi
          cp "$binary" upload/
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: upload/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # trusted publishing and provenance
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24 # trusted publishing needs npm 11.5.1 or later
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v5
        with:
          path: artifacts # one directory per target
      - name: Package
        run: |
          cargo xtask package "${GITHUB_REF_NAME%-v*}" \
            --artifacts "$PWD/artifacts" \
            --expect-version "${GITHUB_REF_NAME##*-v}"
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # npm only accepts provenance from public repositories.
          PROVENANCE: ${{ !github.event.repository.private && '--provenance' || '' }}
        run: |
          # npm tries OIDC first and falls back to the token. Once the secret is deleted,
          # do not leave an empty variable behind.
          if [ -z "$NODE_AUTH_TOKEN" ]; then unset NODE_AUTH_TOKEN; fi
          cargo xtask publish "${GITHUB_REF_NAME%-v*}" --execute $PROVENANCE
