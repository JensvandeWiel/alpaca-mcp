# Releases one server. Push a tag `<server>-v<version>`, for example `hello-v0.1.0`.
# Needs the repository secret NPM_TOKEN (npm automation or granular token).
name: release

on:
  push:
    tags: ["*-v[0-9]*"]

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      release: true

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v5
        with:
          path: artifacts # one directory per target
      - name: Package
        run: |
          cargo xtask package "${GITHUB_REF_NAME%-v*}" \
            --artifacts "$PWD/artifacts" \
            --expect-version "${GITHUB_REF_NAME##*-v}"
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # npm only accepts provenance from public repositories.
          PROVENANCE: ${{ !github.event.repository.private && '--provenance' || '' }}
        run: cargo xtask publish "${GITHUB_REF_NAME%-v*}" --execute $PROVENANCE
